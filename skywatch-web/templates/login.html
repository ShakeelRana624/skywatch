<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>SKYWATCH | Secure Authentication Portal</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Exo 2', sans-serif;
      min-height: 100vh;
      background: #050814;
      overflow-x: hidden;
      position: relative;
    }

    /* ===== BACKGROUND WITH YOUR log.png FROM STATIC FOLDER ===== */
    .page-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: url("{{ url_for('static', filename='log.png') }}") center center / cover no-repeat;
      filter: blur(6px);
      transform: scale(1.05);
    }

    /* Dark overlay for text readability */
    .dark-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, 
        rgba(0, 0, 0, 0.7) 0%,
        rgba(5, 8, 20, 0.75) 50%,
        rgba(0, 0, 0, 0.7) 100%);
      z-index: 1;
    }

    /* Tech grid overlay */
    .tech-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(13, 202, 240, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(13, 202, 240, 0.08) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 2;
      pointer-events: none;
    }

    /* Radar scan effect */
    .radar-scan {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .radar-beam {
      position: absolute;
      top: 0;
      left: -50%;
      width: 150%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #0dcaf0, #0dcaf0, transparent);
      filter: blur(2px);
      animation: radarMove 12s linear infinite;
    }

    .radar-beam:nth-child(1) { top: 20%; animation-duration: 10s; opacity: 0.4; }
    .radar-beam:nth-child(2) { top: 50%; animation-duration: 14s; animation-delay: -4s; opacity: 0.3; }
    .radar-beam:nth-child(3) { top: 75%; animation-duration: 18s; animation-delay: -8s; opacity: 0.3; }

    @keyframes radarMove {
      0% { transform: translateX(-100%) rotate(0deg); opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% { transform: translateX(100%) rotate(0deg); opacity: 0; }
    }

    /* Floating Security Icons */
    .floating-icon {
      position: fixed;
      font-size: 20px;
      color: rgba(13, 202, 240, 0.15);
      animation: floatIcon linear infinite;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes floatIcon {
      0% {
        transform: translateY(100vh) translateX(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.2;
      }
      90% {
        opacity: 0.2;
      }
      100% {
        transform: translateY(-100px) translateX(100px) rotate(360deg);
        opacity: 0;
      }
    }

    /* Main Content Wrapper */
    .login-wrapper {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Login Card */
    .login-card {
      max-width: 480px;
      width: 100%;
      background: rgba(10, 20, 40, 0.88);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 45px 40px;
      border: 1px solid rgba(13, 202, 240, 0.4);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(13, 202, 240, 0.2);
      animation: cardEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transition: all 0.4s ease;
    }

    .login-card:hover {
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(13, 202, 240, 0.4);
      border-color: rgba(13, 202, 240, 0.6);
      transform: translateY(-5px);
    }

    @keyframes cardEntrance {
      0% {
        transform: translateY(50px) scale(0.95);
        opacity: 0;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    /* Header Section */
    .login-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo-icon {
      font-size: 4rem;
      color: #0dcaf0;
      filter: drop-shadow(0 0 20px #0dcaf0);
      animation: pulse 3s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }

    .system-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, #0dcaf0, #5ee6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .system-subtitle {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 1px;
    }

    .auth-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 255, 149, 0.1);
      border: 1px solid rgba(0, 255, 149, 0.3);
      border-radius: 30px;
      padding: 8px 20px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 15px;
    }

    .auth-status i {
      color: #00ff95;
    }

    /* Error Message */
    .error-message {
      background: rgba(255, 77, 109, 0.2);
      border: 1px solid #ff4d6d;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 25px;
      display: none;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #ff6b8a;
      animation: shake 0.5s ease;
    }

    .error-message i {
      font-size: 1rem;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 25px;
    }

    .input-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.8);
    }

    .input-label i {
      color: #0dcaf0;
      margin-right: 8px;
    }

    .input-wrapper {
      position: relative;
      background: rgba(0, 0, 0, 0.4);
      border: 1.5px solid rgba(13, 202, 240, 0.3);
      border-radius: 14px;
      transition: all 0.3s ease;
    }

    .input-wrapper:focus-within {
      border-color: #0dcaf0;
      box-shadow: 0 0 15px rgba(13, 202, 240, 0.3);
      transform: translateY(-2px);
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #0dcaf0;
      font-size: 1rem;
    }

    .form-input {
      width: 100%;
      padding: 14px 45px 14px 45px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: color 0.3s;
    }

    .password-toggle:hover {
      color: #0dcaf0;
    }

    /* Password Strength Indicator */
    .security-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .strength-bar {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .strength-fill {
      height: 100%;
      width: 0%;
      background: #ff4d6d;
      transition: width 0.3s, background 0.3s;
      border-radius: 4px;
    }

    .encryption-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.5);
    }

    .encryption-status i {
      color: #0dcaf0;
      font-size: 0.7rem;
    }

    /* Login Button */
    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0dcaf0, #0a58ca);
      border: none;
      border-radius: 40px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 2px;
      color: #000;
      margin-top: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 20px rgba(13, 202, 240, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(13, 202, 240, 0.6);
      letter-spacing: 3px;
    }

    .login-btn:disabled {
      opacity: 0.7;
      transform: none;
      cursor: not-allowed;
    }

    /* Security Footer */
    .security-footer {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .security-features {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(13, 202, 240, 0.1);
      border-radius: 20px;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(13, 202, 240, 0.2);
    }

    .security-badge i {
      color: #0dcaf0;
      font-size: 0.7rem;
    }

    /* Responsive */
    @media (max-width: 576px) {
      .login-card {
        padding: 35px 25px;
        margin: 15px;
      }
      .system-title {
        font-size: 1.6rem;
      }
      .logo-icon {
        font-size: 3rem;
      }
      .form-input {
        padding: 12px 40px 12px 40px;
      }
      .security-badge {
        font-size: 0.65rem;
        padding: 4px 10px;
      }
    }
  </style>
</head>

<body>

  <!-- Background with your log.png -->
  <div class="page-background"></div>
  <div class="dark-overlay"></div>
  <div class="tech-grid"></div>
  
  <!-- Radar Scan Effect -->
  <div class="radar-scan">
    <div class="radar-beam"></div>
    <div class="radar-beam"></div>
    <div class="radar-beam"></div>
  </div>

  <!-- Floating Security Icons -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const icons = [
        '<i class="fas fa-shield-alt"></i>',
        '<i class="fas fa-lock"></i>',
        '<i class="fas fa-user-shield"></i>',
        '<i class="fas fa-fingerprint"></i>',
        '<i class="fas fa-key"></i>',
        '<i class="fas fa-eye"></i>'
      ];
      
      for (let i = 0; i < 15; i++) {
        const icon = document.createElement('div');
        icon.className = 'floating-icon';
        icon.innerHTML = icons[Math.floor(Math.random() * icons.length)];
        icon.style.left = Math.random() * 100 + 'vw';
        icon.style.animationDelay = Math.random() * 15 + 's';
        icon.style.animationDuration = 12 + Math.random() * 20 + 's';
        icon.style.fontSize = (14 + Math.random() * 20) + 'px';
        icon.style.opacity = 0.08 + Math.random() * 0.12;
        document.body.appendChild(icon);
      }
    });
  </script>

  <!-- Login Container -->
  <div class="login-wrapper">
    <div class="login-card">
      
      <!-- Error Message (hidden by default) -->
      <div id="errorMessage" class="error-message">
        <i class="fas fa-exclamation-triangle"></i>
        <span id="errorText">Authentication Failed. Please verify your credentials.</span>
      </div>

      <!-- Header -->
      <div class="login-header">
        <div class="logo-section">
          <i class="fas fa-satellite-dish logo-icon"></i>
          <div class="system-title">SKYWATCH IOV</div>
          <div class="system-subtitle">Secure Surveillance & Control Platform</div>
        </div>
        
        <div class="auth-status">
          <i class="fas fa-shield-check"></i>
          <span>Authentication Required • AES-256 Encrypted</span>
        </div>
      </div>

      <!-- Login Form -->
      <form id="loginForm" method="POST" action="/login">
        <!-- Email Field -->
        <div class="form-group">
          <label class="input-label">
            <i class="fas fa-user-secret"></i>
            OPERATOR IDENTIFICATION
          </label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" 
                   class="form-input" 
                   name="username" 
                   id="email" 
                   placeholder="admin@skywat8ch.secure" 
                   required
                   autocomplete="email"
                   autofocus>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label class="input-label">
            <i class="fas fa-key"></i>
            SECURITY ACCESS CODE
          </label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" 
                   class="form-input" 
                   name="password" 
                   id="password" 
                   placeholder="••••••••" 
                   required
                   autocomplete="current-password"
                   oninput="updateStrength(this.value)">
            <button type="button" class="password-toggle" id="togglePassword">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          
          <!-- Password Strength Indicator -->
          <div class="security-indicator">
            <div class="strength-bar">
              <div id="strengthFill" class="strength-fill"></div>
            </div>
            <div class="encryption-status">
              <i class="fas fa-lock"></i>
              <span>256-bit AES</span>
            </div>
          </div>
        </div>

        <!-- Login Button -->
        <button type="submit" class="login-btn" id="loginBtn">
          <i class="fas fa-fingerprint"></i>
          INITIATE SYSTEM ACCESS
        </button>
      </form>

      <!-- Security Footer -->
      <div class="security-footer">
        <div style="color: rgba(255,255,255,0.6); font-size: 0.85rem; margin-bottom: 12px;">
          <i class="fas fa-exclamation-circle"></i> Restricted Access - Authorized Personnel Only
        </div>
        
        <div class="security-features">
          <div class="security-badge">
            <i class="fas fa-shield-alt"></i>
            <span>Multi-Factor Authentication</span>
          </div>
          <div class="security-badge">
            <i class="fas fa-broadcast-tower"></i>
            <span>Real-time Monitoring</span>
          </div>
          <div class="security-badge">
            <i class="fas fa-satellite"></i>
            <span>IOV Integration</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ===== CHECK IF BACKGROUND IMAGE LOADS =====
    (function checkBackground() {
      const testImg = new Image();
      testImg.onload = function() {
        console.log('✅ Background image loaded successfully from static/log.png');
      };
      testImg.onerror = function() {
        console.warn('⚠️ Background image not found at static/log.png');
      };
      testImg.src = "{{ url_for('static', filename='log.png') }}";
    })();

    // ===== TOGGLE PASSWORD VISIBILITY =====
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const icon = this.querySelector('i');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });

    // ===== PASSWORD STRENGTH CHECKER =====
    function updateStrength(password) {
      const strengthFill = document.getElementById('strengthFill');
      let strength = 0;
      
      if (password.length > 0) strength += 20;
      if (password.length >= 6) strength += 20;
      if (/[A-Z]/.test(password)) strength += 20;
      if (/[0-9]/.test(password)) strength += 20;
      if (/[^A-Za-z0-9]/.test(password)) strength += 20;
      
      strengthFill.style.width = strength + '%';
      
      if (strength < 40) {
        strengthFill.style.background = '#ff4d6d';
      } else if (strength < 80) {
        strengthFill.style.background = '#ffc107';
      } else {
        strengthFill.style.background = '#00ff95';
      }
    }

    // ===== FORM SUBMIT HANDLER =====
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      const loginBtn = document.getElementById('loginBtn');
      
      // Validation
      if (!email || !password) {
        errorText.textContent = 'All fields are required for authentication.';
        errorDiv.style.display = 'flex';
        setTimeout(() => errorDiv.style.display = 'none', 3000);
        return;
      }
      
      // Show loading state
      const originalHTML = loginBtn.innerHTML;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> VERIFYING CREDENTIALS...';
      loginBtn.disabled = true;
      
      // Submit form
      const formData = new FormData(this);
      
      try {
        const response = await fetch(this.action, {
          method: 'POST',
          body: formData,
          headers: {
            'X-Requested-With': 'XMLHttpRequest'
          }
        });
        
        if (response.ok) {
          // Success
          loginBtn.innerHTML = '<i class="fas fa-check-circle"></i> ACCESS GRANTED';
          loginBtn.style.background = 'linear-gradient(135deg, #00ff95, #00cc76)';
          
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 1000);
        } else {
          throw new Error('Invalid credentials');
        }
      } catch (error) {
        // Error
        errorText.textContent = 'Invalid credentials. Please verify your operator ID and access code.';
        errorDiv.style.display = 'flex';
        
        // Highlight input fields
        document.querySelectorAll('.input-wrapper').forEach(wrapper => {
          wrapper.style.borderColor = '#ff4d6d';
          wrapper.style.boxShadow = '0 0 15px rgba(255, 77, 109, 0.3)';
          setTimeout(() => {
            wrapper.style.borderColor = '';
            wrapper.style.boxShadow = '';
          }, 2000);
        });
        
        // Reset button
        loginBtn.innerHTML = originalHTML;
        loginBtn.disabled = false;
        
        setTimeout(() => {
          errorDiv.style.display = 'none';
        }, 3000);
      }
    });

    // ===== KEYBOARD SHORTCUT (Ctrl+Alt+D for demo credentials) =====
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.altKey && e.key === 'D') {
        document.getElementById('email').value = 'admin@skywatch.secure';
        document.getElementById('password').value = 'SkyWatch2024!';
        updateStrength('SkyWatch2024!');
        
        // Show notification
        const notification = document.createElement('div');
        notification.style.cssText = `
          position: fixed;
          bottom: 20px;
          right: 20px;
          background: rgba(0, 255, 149, 0.2);
          backdrop-filter: blur(10px);
          border: 1px solid #00ff95;
          color: #00ff95;
          padding: 12px 20px;
          border-radius: 12px;
          z-index: 9999;
          font-size: 0.85rem;
          display: flex;
          align-items: center;
          gap: 10px;
          animation: cardEntrance 0.3s ease;
        `;
        notification.innerHTML = '<i class="fas fa-info-circle"></i> Demo credentials loaded';
        document.body.appendChild(notification);
        setTimeout(() => notification.remove(), 3000);
      }
    });
  </script>
</body>
</html>
