<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - UAV-IOV Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{ font-family:'Poppins', sans-serif; margin:0; background:#1a233a; color:white; }
.navbar { background: linear-gradient(90deg, #0dcaf0, #0a58ca); padding:12px 25px; display:flex; justify-content:space-between; align-items:center; }
.nav-buttons button { background:#0dcaf0; color:black; border:none; padding:6px 12px; margin-left:5px; border-radius:20px; cursor:pointer; transition:0.3s; }
.nav-buttons button:hover { background:white; transform: scale(1.05); }

.setting-card { background: rgba(26,35,58,0.85); padding:15px; margin:15px 0; border-radius:12px; box-shadow:0 0 20px rgba(13,202,240,0.5); transition:0.3s; }
.setting-card:hover { transform:translateY(-5px); box-shadow:0 0 30px rgba(13,202,240,0.7); }
.toggle-switch { position:relative; display:inline-block; width:60px; height:34px; }
.toggle-switch input { opacity:0; width:0; height:0; }
.slider { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:#ccc; transition:.4s; border-radius:34px; }
.slider:before { position:absolute; content:""; height:26px; width:26px; left:4px; bottom:4px; background:white; transition:.4s; border-radius:50%; }
input:checked + .slider { background:#0dcaf0; }
input:checked + .slider:before { transform: translateX(26px); }
</style>
</head>
<body>
<nav class="navbar">
<h3>Settings</h3>
<div class="nav-buttons"><button onclick="goHome()">🏠 Home</button></div>
</nav>

<div class="container mt-4">
<div class="setting-card">
<h5>Enable Notifications</h5>
<label class="toggle-switch">
<input type="checkbox" id="notifToggle">
<span class="slider"></span>
</label>
</div>

<div class="setting-card">
<h5>UAV Auto-Return</h5>
<label class="toggle-switch">
<input type="checkbox" id="autoReturn">
<span class="slider"></span>
</label>
</div>

<div class="setting-card">
<h5>Detection Sensitivity</h5>
<input type="range" min="1" max="10" value="5" id="sensitivity" class="form-range">
</div>
</div>

<script>
function goHome(){ window.location.href="dash.html"; }
</script>
</body>
</html>
