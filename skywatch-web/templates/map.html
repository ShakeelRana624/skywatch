<style>
    * {
        margin: 0;

    }

    :root {

        --primary-dark: #0a58ca;

        --warning: #ffc107;
        --success: #00ff95;

        --card-bg: rgba(15, 25, 45, 0.92);
        --neon-glow: 0 0 15px var(--primary), 0 0 25px var(--primary);
    }

    body {
        font-family: 'Exo 2', sans-serif;
        background: var(--dark-bg);
        color: #fff;
        overflow: hidden;
        height: 100vh;
    }

    /* Animated Background */
    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 20% 30%, rgba(13,202,240,0.08) 0%, transparent 60%),
                    radial-gradient(circle at 80% 70%, rgba(255,77,109,0.08) 0%, transparent 60%);
        z-index: -2;
        animation: pulseBg 8s ease-in-out infinite;
    }

    .grid-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: linear-gradient(rgba(13,202,240,0.05) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(13,202,240,0.05) 1px, transparent 1px);
        background-size: 45px 45px;
        z-index: -1;
        animation: gridMove 20s linear infinite;
    }
        animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
        0% { transform: translateY(0); }
        100% { transform: translateY(45px); }
    }

    @keyframes pulseBg {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
    }

    /* Navbar */
    .navbar {
        background: linear-gradient(90deg, rgba(13, 202, 240, 0.15), rgba(10, 88, 202, 0.15));
        backdrop-filter: blur(12px);
        border: 1px solid rgba(13, 202, 240, 0.3);
        border-radius: 24px;
        padding: 10px 24px;
        margin: 12px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        animation: slideDown 0.6s ease-out;
        z-index: 1000;
        position: relative;
    }

    @keyframes slideDown {
        from { transform: translateY(-100px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    .navbar h3 {
        font-family: 'Orbitron', sans-serif;
        font-weight: 800;
        background: linear-gradient(135deg, #fff, var(--primary));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1.2rem;
    }

    .firebase-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 30px;
        font-size: 0.7rem;
        background: rgba(0,0,0,0.6);
        border: 1px solid rgba(13,202,240,0.3);
    }

    .nav-buttons {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
    }

    .nav-btn {
        background: rgba(13, 202, 240, 0.12);
        border: 1px solid rgba(13, 202, 240, 0.4);
        color: #fff;
        padding: 8px 18px;
        border-radius: 30px;

        font-size: 0.85rem;
        font-weight: 600;
        display: inline-flex;

        gap: 8px;

    .nav-btn:hover {
        background: rgba(13, 202, 240, 0.25);
        border-color: rgba(13, 202, 240, 0.8);
        transform: translateY(-2px);

    .nav-badge {
        background: #ff4d6d;
        color: #fff;

        padding: 2px 7px;
        border-radius: 20px;
        position: absolute;
        top: -6px;
        right: -8px;
        font-weight: 700;
    }

    /* Main Container */
    .map-container {
        position: relative;
        height: calc(100vh - 85px);
        margin: 0 18px 18px 18px;
        border-radius: 28px;
        overflow: hidden;
        border: 1px solid rgba(13,202,240,0.3);

    #map {
        height: 100%;

    /* Info Panel */
    .info-panel {

    .info-panel h4 {

    .threat-list {

    .threat-item {

    .live-badge {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #00ff95;
        border-radius: 50%;
        animation: pulse 1.5s infinite;
        margin-right: 6px;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.2); }
    }

    /* Legend */
    .legend {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        border-radius: 16px;
        padding: 12px 18px;
        border: 1px solid rgba(13,202,240,0.3);
        z-index: 1000;
        font-size: 0.7rem;
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .legend-color {
        width: 20px;
        height: 20px;
        border-radius: 50%;
    }

    .legend-color.uav { background: #0dcaf0; box-shadow: 0 0 8px cyan; }
    .legend-color.iov { background: #00ff95; box-shadow: 0 0 8px #00ff95; }
    .legend-color.threat { background: #ff4d6d; box-shadow: 0 0 8px #ff4d6d; }
    .legend-color.camera { background: #ffc107; }

    /* ===== THREAT RADIATION PULSE ANIMATION ===== */
    .threat-pulse-container {
        position: relative;
        width: 60px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .threat-pulse-container .threat-icon {
        position: relative;
        z-index: 10;
        font-size: 24px;
        filter: drop-shadow(0 0 8px currentColor);
        animation: iconPulse 1.5s ease-in-out infinite;
    }
    
    .pulse-ring {
        position: absolute;
        border-radius: 50%;
        border: 2px solid currentColor;
        opacity: 0;
        animation: radiationPulse 2s ease-out infinite;
    }
    
    .pulse-ring:nth-child(1) {
        width: 20px;
        height: 20px;
        animation-delay: 0s;
    }
    
    .pulse-ring:nth-child(2) {
        width: 35px;
        height: 35px;
        animation-delay: 0.4s;
    }
    
    .pulse-ring:nth-child(3) {
        width: 50px;
        height: 50px;
        animation-delay: 0.8s;
    }
    
    .pulse-ring:nth-child(4) {
        width: 65px;
        height: 65px;
        animation-delay: 1.2s;
    }
    
    @keyframes radiationPulse {
        0% {
            transform: scale(0.5);
            opacity: 0.8;
        }
        50% {
            opacity: 0.4;
        }
        100% {
            transform: scale(1.2);
            opacity: 0;
        }
    }
    
    @keyframes iconPulse {
        0%, 100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.1);
        }
    }
    
    /* Priority Colors for Pulse */
    .threat-pulse-high { color: #ff4d6d; }
    .threat-pulse-high .pulse-ring { border-color: #ff4d6d; box-shadow: 0 0 10px #ff4d6d, inset 0 0 5px rgba(255,77,109,0.3); }
    
    .threat-pulse-medium { color: #ffc107; }
    .threat-pulse-medium .pulse-ring { border-color: #ffc107; box-shadow: 0 0 10px #ffc107, inset 0 0 5px rgba(255,193,7,0.3); }
    
    .threat-pulse-low { color: #00ff95; }
    .threat-pulse-low .pulse-ring { border-color: #00ff95; box-shadow: 0 0 10px #00ff95, inset 0 0 5px rgba(0,255,149,0.3); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
</style>

<script>
// ========== FIREBASE CONFIGURATION ==========
const FIREBASE_CONFIG = {
    apiKey: "AIzaSyBo38muJcR0_gYFKz9gJ1BQEC1twgHy2tE",
    authDomain: "fypiov.firebaseapp.com",
    databaseURL: "https://fypiov-default-rtdb.firebaseio.com",
    projectId: "fypiov",
    storageBucket: "fypiov.firebasestorage.app",
    messagingSenderId: "1022795874212",
    appId: "1:1022795874212:web:1fd40b8bbe7849fd3acb31"
};

// ========== GLOBAL VARIABLES ==========
let map;
let uavMarkers = [];
let iovMarkers = [];
let threatMarkers = [];
let cameraMarkers = [];
let markerClusterGroup;
let allAlerts = [];
let iovsData = {};
let camerasData = {};
let trackedVehicle = null;

// Route tracking variables
let routeLines = [];
let activeRoutes = new Map(); // alertId -> route data
let currentIOVPosition = null;
let targetAlertPosition = null;
let routeUpdateInterval = null;

// Threat icon with radiation pulse - priority based colors
function getThreatIcon(priority = 'MEDIUM') {
    const priorityClass = priority === 'HIGH' ? 'threat-pulse-high' : priority === 'MEDIUM' ? 'threat-pulse-medium' : 'threat-pulse-low';
    const iconColor = priority === 'HIGH' ? '#ff4d6d' : priority === 'MEDIUM' ? '#ffc107' : '#00ff95';
    
    return L.divIcon({
        html: `
            <div class="threat-pulse-container ${priorityClass}">
                <div class="pulse-ring"></div>
                <div class="pulse-ring"></div>
                <div class="pulse-ring"></div>
                <div class="pulse-ring"></div>
                <i class="fas fa-skull-crossbones threat-icon" style="color: ${iconColor};"></i>
            </div>
        `,
        iconSize: [60, 60],
        className: 'custom-marker threat-marker',
        iconAnchor: [30, 30]
    });
}

// Custom Icons
const uavIcon = L.divIcon({
    html: '<i class="fas fa-drone" style="font-size: 22px; color: #0dcaf0; filter: drop-shadow(0 0 5px cyan);"></i>',
    iconSize: [30, 30],
    className: 'custom-marker'
});

const iovIcon = L.divIcon({
    html: '<i class="fas fa-car-side" style="font-size: 22px; color: #ff4d6d; filter: drop-shadow(0 0 4px #ff4d6d);"></i>',
    iconSize: [30, 30],
    className: 'custom-marker'
});

const trackedIovIcon = L.divIcon({
    html: '<i class="fas fa-car-side" style="font-size: 26px; color: #ff0000; filter: drop-shadow(0 0 8px #ff0000); animation: pulse 1s infinite;"></i>',
    iconSize: [35, 35],
    className: 'custom-marker tracked-vehicle'
});

const threatIcon = L.divIcon({
    html: '<i class="fas fa-skull-crossbones" style="font-size: 24px; color: #ff4d6d; filter: drop-shadow(0 0 8px #ff4d6d); animation: pulse 1s infinite;"></i>',
    iconSize: [30, 30],
    className: 'custom-marker'
});

const cameraIcon = L.divIcon({
    html: '<i class="fas fa-video" style="font-size: 18px; color: #ffc107; filter: drop-shadow(0 0 3px gold);"></i>',
    iconSize: [24, 24],
    className: 'custom-marker'
});

// ========== GET URL PARAMETERS ==========
function getUrlParameter(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name);
}

// ========== INITIALIZE MAP ==========
function initMap() {
    map = L.map('map').setView([32.5, 74.2], 10);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
    }).addTo(map);
    
    markerClusterGroup = L.markerClusterGroup({
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true,
        disableClusteringAtZoom: 14
    });
    map.addLayer(markerClusterGroup);
    
    console.log('🗺️ Map initialized with light tiles');
}

// ========== FIREBASE INITIALIZATION ==========
function initFirebase() {
    try {
        // Check if Firebase app is already initialized
        if (firebase.apps.length === 0) {
            firebase.initializeApp(FIREBASE_CONFIG);
        }
        const db = firebase.database();
        
        const statusDiv = document.getElementById('firebaseStatus');
        const statusText = document.getElementById('statusText');
        
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val()) {
                statusDiv.querySelector('.live-badge').style.background = '#00ff95';
                statusText.innerText = 'LIVE';
                console.log('✅ Firebase Connected');
                loadFirebaseData(db);
            } else {
                statusDiv.querySelector('.live-badge').style.background = '#ff4d6d';
                statusText.innerText = 'OFFLINE';
            }
        });
    } catch (error) {
        console.error('Firebase init error:', error);
        loadDemoData();
    }
}

// ========== LOAD ALL FIREBASE DATA ==========
function loadFirebaseData(db) {
    db.ref('alerts').on('value', (snapshot) => {
        const alerts = snapshot.val();
        allAlerts = [];
        if (alerts) {
            Object.keys(alerts).forEach(key => {
                const alert = alerts[key];
                alert.id = key;
                allAlerts.push(alert);
                
                // Check if alert was accepted by IoV
                if (alert.status === 'accepted' && alert.accepted_by === 'IOV') {
                    handleAcceptedAlert(alert, key);
                }
            });
            allAlerts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        }
        updateThreatMarkers();
        updateThreatList();
        updateStats();
    });
    
    db.ref('iovs').on('value', (snapshot) => {
        iovsData = snapshot.val() || {};
        
        Object.keys(iovsData).forEach(iovId => {
            const iov = iovsData[iovId];
            
            if (iov.lastSeen) {
                const lastSeenTime = new Date(iov.lastSeen).getTime();
                const now = Date.now();
                const timeDiff = now - lastSeenTime;
                iov.isOnline = timeDiff < 120000;
                iov.lastSeenFormatted = new Date(iov.lastSeen).toLocaleString();
            } else if (iov.hasOwnProperty('isOnline')) {
                iov.isOnline = iov.isOnline;
            } else if (iov.status) {
                const statusLower = iov.status.toLowerCase();
                iov.isOnline = statusLower === 'online' || statusLower === 'active' || statusLower === 'available';
            } else {
                iov.isOnline = true;
            }
        });
        
        updateIOVMarkers();
        updateIOVList();
        updateStats();
        console.log(`🚗 IOVs loaded: ${Object.keys(iovsData).length}`);
    });
    
    db.ref('cameras').on('value', (snapshot) => {
        camerasData = snapshot.val() || {};
        updateCameraMarkers();
        updateStats();
        console.log(`📹 Cameras loaded: ${Object.keys(camerasData).length}`);
    });
}

// ========== HANDLE ACCEPTED ALERTS ==========
function handleAcceptedAlert(alert, alertId) {
    console.log(`🎯 Accepted alert detected: ${alertId}`);
    
    // Validate alert data
    if (!alert || !alertId) {
        console.warn('Invalid alert data provided');
        return;
    }
    
    // Get IoV position from alert (which IoV accepted it)
    const iovId = alert.accepted_by_iov || alert.assigned_iov || alert.iov_id;
    const alertLat = alert.location?.lat || alert.iov_location?.lat;
    const alertLng = alert.location?.lng || alert.iov_location?.lng;
    
    if (!alertLat || !alertLng || isNaN(alertLat) || isNaN(alertLng)) {
        console.warn('Invalid alert location for route tracking:', { alertLat, alertLng });
        return;
    }
    
    const alertPosition = { lat: parseFloat(alertLat), lng: parseFloat(alertLng) };
    
    // Find the IoV that accepted this alert
    let assignedIOV = null;
    
    if (iovId && iovsData[iovId]) {
        // Specific IoV assigned to this alert
        const iov = iovsData[iovId];
        if (iov.isOnline) {
            const iovLat = iov.latitude || iov.lat;
            const iovLng = iov.longitude || iov.lng;
            
            if (iovLat && iovLng) {
                assignedIOV = {
                    id: iovId,
                    position: { lat: parseFloat(iovLat), lng: parseFloat(iovLng) },
                    data: iov
                };
                console.log(`🚗 Assigned IoV found: ${iov.fullName || iovId}`);
            }
        }
    }
    
    // If no specific IoV, find the nearest online IoV
    if (!assignedIOV) {
        let minDistance = Infinity;
        
        Object.keys(iovsData).forEach(iovId => {
            const iov = iovsData[iovId];
            if (iov.isOnline) {
                const iovLat = iov.latitude || iov.lat;
                const iovLng = iov.longitude || iov.lng;
                
                if (iovLat && iovLng) {
                    const distance = calculateDistance(iovLat, iovLng, alertPosition.lat, alertPosition.lng);
                    if (distance < minDistance) {
                        minDistance = distance;
                        assignedIOV = {
                            id: iovId,
                            position: { lat: parseFloat(iovLat), lng: parseFloat(iovLng) },
                            data: iov
                        };
                    }
                }
            }
        });
    }
    
    if (assignedIOV) {
        console.log(`🚗 IoV responding: ${assignedIOV.data.fullName || assignedIOV.id} (${calculateDistance(assignedIOV.position.lat, assignedIOV.position.lng, alertPosition.lat, alertPosition.lng).toFixed(1)} km away)`);
        
        // Get camera location for the route destination
        const cameraPosition = getCameraLocationForAlert(alert);
        
        // Validate assignedIOV position
        if (!assignedIOV || !assignedIOV.position || !assignedIOV.position.lat || !assignedIOV.position.lng) {
            console.warn('Invalid IoV position for route tracking:', assignedIOV);
            showNotification('⚠️ Invalid IoV position data', 'warning');
            return;
        }
        
        if (cameraPosition) {
            // Draw route from IoV car to detection camera
            startRouteTracking(alertId, assignedIOV.position, cameraPosition);
            
            // Update IoV status to "responding"
            if (firebaseDb) {
                firebaseDb.ref('iovs/' + assignedIOV.id).update({
                    status: 'responding',
                    current_alert: alertId,
                    responding_to: alertId
                });
            }
            
            const distance = calculateDistance(assignedIOV.position.lat, assignedIOV.position.lng, cameraPosition.lat, cameraPosition.lng);
            showNotification(`🚗 ${assignedIOV.data.fullName || 'IoV'} responding to camera location (${distance.toFixed(1)} km away)`, 'success');
        } else {
            // Fallback to alert location if camera not found
            startRouteTracking(alertId, assignedIOV.position, alertPosition);
            const distance = calculateDistance(assignedIOV.position.lat, assignedIOV.position.lng, alertPosition.lat, alertPosition.lng);
            showNotification(`🚗 ${assignedIOV.data.fullName || 'IoV'} responding to alert location (${distance.toFixed(1)} km away)`, 'success');
        }
    } else {
        console.warn('No online IoVs available for alert');
        showNotification('⚠️ No online IoVs available for this alert', 'warning');
    }
}

// ========== GET CAMERA LOCATION FOR ALERT ==========
function getCameraLocationForAlert(alert) {
    // Try to get camera ID from alert
    const cameraId = alert.camera_id || alert.camera_name || alert.source_camera;
    
    if (cameraId && camerasData[cameraId]) {
        const camera = camerasData[cameraId];
        const camLat = camera.latitude || camera.lat;
        const camLng = camera.longitude || camera.lng;
        
        if (camLat && camLng) {
            console.log(`📹 Found camera location: ${camera.name || cameraId}`);
            return { lat: parseFloat(camLat), lng: parseFloat(camLng) };
        }
    }
    
    // Try to match camera by name/location
    const alertLocation = alert.location_name || alert.city || alert.Area;
    if (alertLocation) {
        for (const [camId, camera] of Object.entries(camerasData)) {
            const camLocation = camera.city || camera.address;
            if (camLocation && camLocation.toLowerCase().includes(alertLocation.toLowerCase())) {
                const camLat = camera.latitude || camera.lat;
                const camLng = camera.longitude || camera.lng;
                
                if (camLat && camLng) {
                    console.log(`📹 Matched camera by location: ${camera.name || camId}`);
                    return { lat: parseFloat(camLat), lng: parseFloat(camLng) };
                }
            }
        }
    }
    
    console.warn('Camera location not found for alert');
    return null;
}

// ========== ROUTE TRACKING FUNCTIONS ==========
function drawRouteLine(startPos, endPos, alertId, routeColor = '#00ff95') {
    // Remove existing route for this alert
    if (activeRoutes.has(alertId)) {
        const existingRoute = activeRoutes.get(alertId);
        if (existingRoute.line) {
            map.removeLayer(existingRoute.line);
        }
        if (existingRoute.distanceMarker) {
            map.removeLayer(existingRoute.distanceMarker);
        }
    }

    // Create route line from IoV to Camera
    const routeCoords = [startPos, endPos];
    
    const routeLine = L.polyline(routeCoords, {
        color: routeColor,
        weight: 5,
        opacity: 0.9,
        dashArray: '15, 10',
        className: 'animated-route-line'
    }).addTo(map);

    // Calculate distance
    const distance = calculateDistance(startPos.lat, startPos.lng, endPos.lat, endPos.lng);
    
    // Add route info marker at midpoint
    const midPoint = {
        lat: (startPos.lat + endPos.lat) / 2,
        lng: (startPos.lng + endPos.lng) / 2
    };

    const routeIcon = L.divIcon({
        html: `<div style="background: linear-gradient(135deg, rgba(0,255,149,0.95), rgba(0,204,102,0.95)); color: black; padding: 6px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; border: 2px solid #00ff95; box-shadow: 0 4px 15px rgba(0,255,149,0.4);">
                � → 📹 ${distance.toFixed(1)} km
               </div>`,
        className: 'route-info-marker',
        iconSize: [120, 35],
        iconAnchor: [60, 17]
    });

    const routeInfoMarker = L.marker(midPoint, { icon: routeIcon }).addTo(map);

    // Store route data
    activeRoutes.set(alertId, {
        line: routeLine,
        distanceMarker: routeInfoMarker,
        distance: distance,
        start: startPos,
        end: endPos,
        color: routeColor
    });

    console.log(`🛣️ IoV-to-Camera route drawn: ${distance.toFixed(1)} km for alert ${alertId}`);
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; // Earth's radius in km
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function startRouteTracking(alertId, iovPosition, alertPosition) {
    currentIOVPosition = iovPosition;
    targetAlertPosition = alertPosition;

    // Draw initial route
    drawRouteLine(iovPosition, alertPosition, alertId);

    // Start real-time updates
    if (routeUpdateInterval) {
        clearInterval(routeUpdateInterval);
    }

    routeUpdateInterval = setInterval(() => {
        updateRouteTracking(alertId);
    }, 3000); // Update every 3 seconds

    // Show tracking notification
    showTrackingNotification(alertId);
}

function updateRouteTracking(alertId) {
    // Simulate IoV movement towards target
    if (!currentIOVPosition || !targetAlertPosition) return;

    // Calculate movement (simulate IoV getting closer)
    const step = 0.002; // Movement step size
    const newLat = currentIOVPosition.lat + (targetAlertPosition.lat - currentIOVPosition.lat) * step;
    const newLng = currentIOVPosition.lng + (targetAlertPosition.lng - currentIOVPosition.lng) * step;

    currentIOVPosition = { lat: newLat, lng: newLng };

    // Update route line
    drawRouteLine(currentIOVPosition, targetAlertPosition, alertId);

    // Update IoV marker position
    updateIOVMarkerPosition(currentIOVPosition);

    // Check if reached destination
    const distance = calculateDistance(currentIOVPosition.lat, currentIOVPosition.lng, 
                                     targetAlertPosition.lat, targetAlertPosition.lng);
    
    if (distance < 0.1) { // Within 100 meters
        completeRouteTracking(alertId);
    }
}

function updateIOVMarkerPosition(position) {
    // Find and update the tracked IoV marker
    iovMarkers.forEach(marker => {
        const markerPos = marker.getLatLng();
        if (Math.abs(markerPos.lat - position.lat) < 0.01 && 
            Math.abs(markerPos.lng - position.lng) < 0.01) {
            marker.setLatLng(position);
            marker.setIcon(trackedIovIcon);
        }
    });
}

function completeRouteTracking(alertId) {
    if (routeUpdateInterval) {
        clearInterval(routeUpdateInterval);
        routeUpdateInterval = null;
    }

    // Show completion notification
    const route = activeRoutes.get(alertId);
    if (route) {
        // Change route color to indicate completion
        route.line.setStyle({ color: '#00ff95', dashArray: null, weight: 6 });
        
        // Update route info marker to show arrival
        route.distanceMarker.setIcon(L.divIcon({
            html: `<div style="background: linear-gradient(135deg, rgba(0,255,149,0.95), rgba(0,204,102,0.95)); color: black; padding: 6px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; border: 2px solid #00ff95; box-shadow: 0 4px 15px rgba(0,255,149,0.4);">
                    ✅ ARRIVED AT CAMERA
                   </div>`,
            className: 'route-completion-marker',
            iconSize: [140, 35],
            iconAnchor: [70, 17]
        }));
    }

    showNotification('🎯 IoV arrived at camera location! Response complete.', 'success');
    console.log(`✅ IoV-to-Camera route completed for alert ${alertId}`);
}

function showTrackingNotification(alertId) {
    const route = activeRoutes.get(alertId);
    if (route) {
        showNotification(`🚗 Route tracking active - ${route.distance.toFixed(1)} km to target`, 'info');
    }
}

function clearAllRoutes() {
    activeRoutes.forEach((route, alertId) => {
        if (route.line) map.removeLayer(route.line);
        if (route.distanceMarker) map.removeLayer(route.distanceMarker);
    });
    activeRoutes.clear();
    routeLines = [];
    
    if (routeUpdateInterval) {
        clearInterval(routeUpdateInterval);
        routeUpdateInterval = null;
    }
}

// ========== URL PARAMETER HANDLING ==========
function handleURLParameters() {
    const urlParams = new URLSearchParams(window.location.search);
    const alertId = urlParams.get('alert');
    const lat = parseFloat(urlParams.get('lat'));
    const lng = parseFloat(urlParams.get('lng'));
    const tracking = urlParams.get('tracking') === 'true';

    if (alertId && lat && lng) {
        // Focus on alert location
        map.setView([lat, lng], 15);
        
        if (tracking) {
            // Start route tracking after a delay to allow IoV data to load
            setTimeout(() => {
                const firstIOV = Object.keys(iovsData)[0];
                if (firstIOV && iovsData[firstIOV]) {
                    const iov = iovsData[firstIOV];
                    const iovPos = {
                        lat: iov.latitude || iov.lat || 32.5,
                        lng: iov.longitude || iov.lng || 74.2
                    };
                    const alertPos = { lat, lng };
                    startRouteTracking(alertId, iovPos, alertPos);
                }
            }, 2000);
        }
    }
}

// ========== UTILITIES ==========

function showNotification(message, type = 'info') {
    const notification = document.createElement('div');
    notification.style.cssText = `
        position: fixed;
        top: 100px;
        right: 20px;
        padding: 12px 20px;
        border-radius: 10px;
        color: white;
        font-weight: 600;
        z-index: 10000;
        animation: slideInRight 0.3s ease-out;
        max-width: 300px;
    `;
    
    const colors = {
        success: 'rgba(0,255,149,0.95)',
        danger: 'rgba(255,77,109,0.95)',
        warning: 'rgba(255,193,7,0.95)',
        info: 'rgba(13,202,240,0.95)'
    };
    
    notification.style.background = colors[type] || colors.info;
    notification.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-triangle' : type === 'warning' ? 'exclamation-circle' : 'info-circle'}"></i> ${message}`;
    
    document.body.appendChild(notification);
    
    setTimeout(() => {
        notification.style.animation = 'slideOutRight 0.3s ease-out';
        setTimeout(() => notification.remove(), 300);
    }, 4000);
}

// Add CSS animations
const style = document.createElement('style');
style.textContent = `
    @keyframes slideInRight {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }

    @keyframes slideOutRight {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(100%); opacity: 0; }
    }

        animation: dashAnimation 2s linear infinite;
    }

`;
