<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SKYWATCH | Personnel Command - Real-Time Status</title>

<!-- Bootstrap & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase SDK - Only Realtime Database -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --primary: #0dcaf0;
        --primary-dark: #0a58ca;
        --danger: #ff4d6d;
        --warning: #ffc107;
        --success: #00ff95;
        --dark-bg: #050814;
    }

    body {
        font-family: 'Exo 2', sans-serif;
        background: var(--dark-bg);
        color: #fff;
        overflow-x: hidden;
        min-height: 100vh;
    }

    /* Animated Background */
    body::before {
        content: '';
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: radial-gradient(circle at 20% 30%, rgba(13,202,240,0.08) 0%, transparent 60%),
                    radial-gradient(circle at 80% 70%, rgba(255,77,109,0.08) 0%, transparent 60%);
        z-index: -2;
        animation: pulseBg 8s ease-in-out infinite;
    }

    .grid-overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-image: linear-gradient(rgba(13,202,240,0.05) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(13,202,240,0.05) 1px, transparent 1px);
        background-size: 45px 45px;
        z-index: -1;
        animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove { 0% { transform: translateY(0); } 100% { transform: translateY(45px); } }
    @keyframes pulseBg { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes slideDown { from { transform: translateY(-100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideInRight { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.05); } }

    /* Navbar */
    .navbar {
        background: linear-gradient(90deg, rgba(13, 202, 240, 0.15), rgba(10, 88, 202, 0.15));
        backdrop-filter: blur(12px);
        border: 1px solid rgba(13, 202, 240, 0.3);
        border-radius: 24px;
        padding: 10px 24px;
        margin: 12px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        animation: slideDown 0.6s ease-out;
    }

    .navbar h3 {
        font-family: 'Orbitron', sans-serif;
        font-weight: 800;
        background: linear-gradient(135deg, #fff, var(--primary));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1.2rem;
    }

    .firebase-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 30px;
        font-size: 0.7rem;
        background: rgba(0,0,0,0.6);
        border: 1px solid rgba(13,202,240,0.3);
    }

    .live-dot {
        width: 8px;
        height: 8px;
        background: #ff4d6d;
        border-radius: 50%;
        display: inline-block;
        animation: pulse 1.5s infinite;
    }

    .nav-buttons {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
    }

    .nav-btn {
        background: rgba(13, 202, 240, 0.12);
        border: 1px solid rgba(13, 202, 240, 0.4);
        color: #fff;
        padding: 8px 18px;
        border-radius: 30px;
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .nav-btn:hover {
        background: rgba(13, 202, 240, 0.25);
        border-color: rgba(13, 202, 240, 0.8);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(13,202,240,0.3);
    }

    .logout-btn {
        background: rgba(255, 77, 109, 0.15);
        border-color: rgba(255, 77, 109, 0.4);
    }

    /* Page Header */
    .page-header {
        text-align: center;
        margin: 20px 20px 25px;
    }

    .page-header h2 {
        font-family: 'Orbitron', sans-serif;
        font-size: 2rem;
        font-weight: 700;
        background: linear-gradient(135deg, #fff, var(--primary), var(--success));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .page-header p {
        color: rgba(255, 255, 255, 0.6);
    }

    /* Stats Cards */
    .stats-dashboard {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin: 0 20px 25px;
    }

    .stat-card {
        background: rgba(15, 25, 45, 0.7);
        backdrop-filter: blur(15px);
        border-radius: 20px;
        padding: 20px;
        text-align: center;
        border: 1px solid rgba(13, 202, 240, 0.2);
        transition: all 0.3s ease;
    }

    .stat-card:hover {
        transform: translateY(-5px);
        border-color: var(--primary);
        box-shadow: 0 0 30px rgba(13,202,240,0.2);
    }

    .stat-icon {
        font-size: 2rem;
        color: var(--primary);
        margin-bottom: 12px;
    }

    .stat-value {
        font-size: 2rem;
        font-weight: 700;
        font-family: 'Orbitron', sans-serif;
    }

    .stat-label {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.8rem;
    }

    /* Filters */
    .filters-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 20px 20px;
        flex-wrap: wrap;
        gap: 15px;
    }

    .filter-buttons {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }

    .filter-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: rgba(255, 255, 255, 0.8);
        padding: 8px 20px;
        border-radius: 30px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
    }

    .filter-btn.active {
        background: rgba(13, 202, 240, 0.3);
        color: var(--primary);
        border-color: var(--primary);
    }

    .filter-btn:hover {
        transform: translateY(-2px);
        background: rgba(13, 202, 240, 0.2);
    }

    .search-box {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(13,202,240,0.3);
        border-radius: 40px;
        padding: 8px 18px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .search-box input {
        background: transparent;
        border: none;
        color: white;
        outline: none;
        font-size: 0.85rem;
        width: 250px;
    }

    .search-box input::placeholder {
        color: rgba(255,255,255,0.5);
    }

    /* Users Grid */
    .users-container {
        margin: 0 20px 30px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 20px;
    }

    .user-card {
        background: rgba(10, 20, 40, 0.85);
        backdrop-filter: blur(12px);
        border-radius: 24px;
        border: 1px solid rgba(13, 202, 240, 0.2);
        overflow: hidden;
        transition: all 0.3s ease;
        animation: slideInRight 0.4s ease-out;
    }

    .user-card:hover {
        transform: translateY(-5px);
        border-color: var(--primary);
        box-shadow: 0 10px 30px rgba(13,202,240,0.15);
    }

    .card-header {
        padding: 18px 20px;
        background: linear-gradient(90deg, rgba(13,202,240,0.15), rgba(10,88,202,0.1));
        border-bottom: 1px solid rgba(13,202,240,0.2);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .user-info {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .user-avatar {
        width: 52px;
        height: 52px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        font-weight: bold;
        text-transform: uppercase;
    }

    .user-name {
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        font-size: 1.1rem;
    }

    .user-id {
        font-size: 0.65rem;
        color: rgba(255,255,255,0.5);
        font-family: monospace;
    }

    .online-status {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.65rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .online-status.online {
        background: rgba(0,255,149,0.2);
        color: #00ff95;
        border: 1px solid rgba(0,255,149,0.3);
        animation: pulse 2s infinite;
    }

    .online-status.offline {
        background: rgba(255,77,109,0.2);
        color: #ff4d6d;
        border: 1px solid rgba(255,77,109,0.3);
    }

    .role-badge {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: 600;
        background: rgba(13,202,240,0.2);
        color: var(--primary);
    }

    .card-body {
        padding: 18px 20px;
    }

    .info-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 0.85rem;
    }

    .info-label {
        color: rgba(255,255,255,0.5);
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .info-value {
        font-weight: 600;
        font-family: monospace;
    }

    .email-value {
        color: var(--primary);
        font-size: 0.8rem;
    }

    .vehicle-details {
        background: rgba(0,0,0,0.3);
        border-radius: 12px;
        padding: 12px;
        margin-top: 12px;
    }

    .vehicle-title {
        font-size: 0.7rem;
        color: var(--warning);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .card-footer {
        padding: 12px 20px;
        background: rgba(0,0,0,0.3);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        gap: 10px;
    }

    .action-btn {
        background: rgba(13,202,240,0.1);
        border: 1px solid rgba(13,202,240,0.3);
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.7rem;
        cursor: pointer;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }

    .action-btn:hover {
        background: rgba(13,202,240,0.3);
        transform: scale(1.02);
    }

    /* Track button - green with white text */
    .action-btn[onclick*="trackVehicle"] {
        background: #00ff95;
        color: #fff;
        border: 1px solid #00cc77;
        font-weight: 600;
    }

    .action-btn[onclick*="trackVehicle"]:hover {
        background: #00cc77;
        transform: scale(1.05);
        box-shadow: 0 0 15px rgba(0,255,149,0.5);
    }

    .empty-state {
        text-align: center;
        padding: 60px;
        color: rgba(255,255,255,0.5);
    }

    .empty-state i {
        font-size: 4rem;
        margin-bottom: 20px;
        color: var(--primary);
    }

    .notification {
        position: fixed;
        top: 100px;
        right: 20px;
        padding: 12px 20px;
        border-radius: 12px;
        z-index: 9999;
        animation: slideInRight 0.3s ease;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.85rem;
    }

    @keyframes slideOutRight {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(100%); opacity: 0; }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

    @media (max-width: 768px) {
        .navbar { flex-direction: column; gap: 12px; }
        .users-container { grid-template-columns: 1fr; }
        .filters-bar { flex-direction: column; }
        .stats-dashboard { grid-template-columns: repeat(2, 1fr); }
    }
</style>
</head>
<body>

<script>
// ========== FIREBASE CONFIG ==========
const FIREBASE_CONFIG = {
    apiKey: "AIzaSyBo38muJcR0_gYFKz9gJ1BQEC1twgHy2tE",
    authDomain: "fypiov.firebaseapp.com",
    databaseURL: "https://fypiov-default-rtdb.firebaseio.com",
    projectId: "fypiov",
    storageBucket: "fypiov.firebasestorage.app",
    messagingSenderId: "1022795874212",
    appId: "1:1022795874212:web:1fd40b8bbe7849fd3acb31"
};

// ========== GLOBAL VARIABLES ==========
let allUsers = [];
let filteredUsers = [];
let currentFilter = 'all';
let currentSearch = '';

// ========== ONLINE STATUS ==========
function updateOnlineStatus(user) {
    if (!user) return;

    // Agar status already 'online' hai toh directly online mark karo
    if (user.status === "online") {
        user.isOnline = true;
        user.lastSeenFormatted = "Just now";
        return;
    }

    const lastSeenStr = user.lastSeen || user.lastOnline || user.loggedOutAt || user.logoutTime;
    if (!lastSeenStr) {
        user.isOnline = false;
        user.lastSeenFormatted = 'N/A';
        return;
    }

    try {
        const timeDiff = Date.now() - new Date(lastSeenStr).getTime();
        user.isOnline = timeDiff < 120000;   // 2 minutes ke andar
        user.lastSeenFormatted = new Date(lastSeenStr).toLocaleString('en-PK');
    } catch(e) {
        user.isOnline = false;
        user.lastSeenFormatted = 'Invalid Date';
    }
}

// ========== ONLINE STATUS ==========
function updateOnlineStatus(user) {
    if (!user) return;

    // Agar status already 'online' hai toh directly online mark karo
    if (user.status === "online") {
        user.isOnline = true;
        user.lastSeenFormatted = "Just now";
        return;
    }

    const lastSeenStr = user.lastSeen || user.lastOnline || user.loggedOutAt || user.logoutTime;
    if (!lastSeenStr) {
        user.isOnline = false;
        user.lastSeenFormatted = 'N/A';
        return;
    }

    try {
        const timeDiff = Date.now() - new Date(lastSeenStr).getTime();
        user.isOnline = timeDiff < 120000;   // 2 minutes ke andar
        user.lastSeenFormatted = new Date(lastSeenStr).toLocaleString('en-PK');
    } catch(e) {
        user.isOnline = false;
        user.lastSeenFormatted = 'Invalid Date';
    }
}

// ========== FETCH USER DETAILS FROM FIRESTORE ==========
let firestoreFetchCount = 0;
let totalUsersToFetch = 0;

function fetchUserDetailsFromFirestore(userId, userData) {
    try {
        const firestore = firebase.firestore();
        const usersCollection = firestore.collection('users');
        
        usersCollection.doc(userId).get()
            .then((doc) => {
                if (doc.exists) {
                    const firestoreData = doc.data();
                    
                    userData.email = firestoreData.email || userData.email || 'N/A';
                    userData.phone = firestoreData.phone || userData.phone || 'N/A';
                    userData.fullName = firestoreData.fullName || firestoreData.displayName || userData.fullName || 'Unknown';
                    userData.policeStation = firestoreData.policeStation || userData.policeStation || 'N/A';
                    userData.rank = firestoreData.rank || userData.rank || 'N/A';
                    userData.role = firestoreData.role || userData.role || 'Police';
                    
                    console.log(`📧 Fetched Firestore details for ${userId}:`, firestoreData);
                } else {
                    console.log(`⚠️ No Firestore document found for user: ${userId}`);
                }
                
                firestoreFetchCount++;
                if (firestoreFetchCount === totalUsersToFetch) {
                    // All Firestore data fetched, now update UI
                    processUsersData();
                }
            })
            .catch((error) => {
                console.error(`❌ Error fetching Firestore data for ${userId}:`, error);
                firestoreFetchCount++;
                if (firestoreFetchCount === totalUsersToFetch) {
                    processUsersData();
                }
            });
    } catch (error) {
        console.error('Firestore initialization error:', error);
        firestoreFetchCount++;
        if (firestoreFetchCount === totalUsersToFetch) {
            processUsersData();
        }
    }
}

// ========== INIT REALTIME DATABASE ==========
function initFirebase() {
    try {
        if (firebase.apps.length === 0) {
            firebase.initializeApp(FIREBASE_CONFIG);
        }

        const db = firebase.database();
        const statusDiv = document.getElementById('firebaseStatus');
        const statusText = document.getElementById('statusText');
        const liveDot = statusDiv.querySelector('.live-dot');

        const usersRef = db.ref('iovs');

        usersRef.on('value', (snapshot) => {
            const data = snapshot.val();
            
            if (data && Object.keys(data).length > 0) {
                liveDot.style.background = '#00ff95';
                statusText.textContent = 'LIVE ';

                // Reset counters
                firestoreFetchCount = 0;
                totalUsersToFetch = Object.keys(data).length;

                allUsers = Object.keys(data).map(key => {
                    const userData = data[key];
                    userData.uid = key;
                    updateOnlineStatus(userData);
                    
                    fetchUserDetailsFromFirestore(key, userData);
                    
                    return userData;
                });

                console.log(`✅ Loaded ${allUsers.length} users from /iovs`);
                // Don't call processUsersData() here - wait for Firestore fetches to complete
            } else {
                console.warn('No data found at /iovs path');
                loadSampleData();
            }
        }, (error) => {
            console.error('Realtime Database Error:', error.message);
            showNotification('Cannot connect to Realtime Database. Using demo data.', 'warning');
            loadSampleData();
        });

    } catch (error) {
        console.error('Firebase initialization error:', error);
        loadSampleData();
    }
}

function loadSampleData() {
    allUsers = [...SAMPLE_USERS];
    allUsers.forEach(updateOnlineStatus);
    processUsersData();
    document.getElementById('statusText').textContent = 'DEMO MODE';
}

function processUsersData() {
    allUsers.sort((a, b) => (a.fullName || a.username || '').localeCompare(b.fullName || b.username || ''));
    applyFilters();
    updateStats();
}

function updateStats() {
    document.getElementById('totalUsers').textContent = allUsers.length;
    document.getElementById('onlineUsers').textContent = allUsers.filter(u => u.isOnline).length;
    document.getElementById('vehicleAssigned').textContent = allUsers.filter(u => u.carNumber).length;
    document.getElementById('policeCount').textContent = allUsers.filter(u => (u.role || '').toLowerCase() === 'police').length;
    document.getElementById('alertCount').textContent = allUsers.length;
}

function applyFilters() {
    let filtered = [...allUsers];

    if (currentFilter === 'online') filtered = filtered.filter(u => u.isOnline);
    else if (currentFilter === 'offline') filtered = filtered.filter(u => !u.isOnline);
    else if (currentFilter === 'Police') filtered = filtered.filter(u => (u.role || '').toLowerCase() === 'police');
    else if (currentFilter === '1122') filtered = filtered.filter(u => (u.role || '') === '1122');

    if (currentSearch.trim() !== '') {
        const term = currentSearch.toLowerCase();
        filtered = filtered.filter(u => 
            (u.fullName || u.username || '').toLowerCase().includes(term) ||
            (u.email || '').toLowerCase().includes(term) ||
            (u.policeStation || '').toLowerCase().includes(term) ||
            (u.carNumber || '').includes(term)
        );
    }

    filteredUsers = filtered;
    renderUsers();
}

function filterUsers(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    if (event && event.target) event.target.classList.add('active');
    applyFilters();
}

function searchUsers() {
    currentSearch = document.getElementById('searchInput').value.trim();
    applyFilters();
}

function renderUsers() {
    const container = document.getElementById('usersContainer');
    container.innerHTML = '';

    if (filteredUsers.length === 0) {
        container.innerHTML = `
            <div class="empty-state" style="grid-column: 1/-1;">
                <i class="fas fa-users-slash"></i>
                <h4>No Personnel Found</h4>
                <p>Try changing filter or search term</p>
            </div>`;
        return;
    }

    filteredUsers.forEach(user => {
        const isOnline = !!user.isOnline;
        const initials = (user.fullName || user.username || 'U').split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        const hasVehicle = !!user.carNumber;
        const hasLocation = user.lat != null && user.lng != null;

        const cardHTML = `
            <div class="user-card">
                <div class="card-header">
                    <div class="user-info">
                        <div class="user-avatar">${initials}</div>
                        <div>
                            <div class="user-name">${user.fullName || user.username || 'Unknown'}</div>
                            <div class="user-id">UID: ${user.uid ? user.uid.slice(-12) : 'N/A'}</div>
                        </div>
                    </div>
                    <div class="online-status ${isOnline ? 'online' : 'offline'}">
                        <i class="fas ${isOnline ? 'fa-wifi' : 'fa-wifi-slash'}"></i> ${isOnline ? 'ONLINE' : 'OFFLINE'}
                    </div>
                </div>
                <div class="card-body">
                    <div class="info-row"><span class="info-label"><i class="fas fa-envelope"></i> Email</span><span class="info-value email-value">${user.email || 'N/A'}</span></div>
                    <div class="info-row"><span class="info-label"><i class="fas fa-phone"></i> Phone</span><span class="info-value">${user.phone || 'N/A'}</span></div>
                    <div class="info-row"><span class="info-label"><i class="fas fa-user-tag"></i> Role</span><span class="info-value"><span class="role-badge">${user.role || 'Police'}</span></span></div>
                    <div class="info-row"><span class="info-label"><i class="fas fa-building"></i> Station</span><span class="info-value">${user.policeStation || 'N/A'}</span></div>
                    
                    ${hasVehicle ? `
                    <div class="vehicle-details">
                        <div class="vehicle-title"><i class="fas fa-car"></i> ASSIGNED VEHICLE</div>
                        <div class="info-row"><span class="info-label">Plate</span><span style="color:var(--warning)">${user.carNumber}</span></div>
                    </div>` : ''}
                    
                    ${hasLocation ? `
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-map-marker-alt"></i> Location</span>
                        <span class="info-value">${user.lat.toFixed(4)}, ${user.lng.toFixed(4)} ${user.speed !== undefined ? `| ${user.speed} km/h` : ''}</span>
                    </div>` : ''}
                    
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-clock"></i> Last Seen</span>
                        <span class="info-value" style="color:${isOnline ? '#00ff95' : '#ff4d6d'}">${user.lastSeenFormatted || 'N/A'}</span>
                    </div>
                </div>
                <div class="card-footer">
                    ${hasVehicle ? `<button class="action-btn" onclick="trackVehicle('${user.carNumber}')"><i class="fas fa-location-dot"></i> Track</button>` : ''}
                </div>
            </div>
        `;
        container.innerHTML += cardHTML;
    });
}

// ========== ACTION FUNCTIONS ==========
function viewUserDetails(uid) {
    const user = allUsers.find(u => u.uid === uid);
    if (user) alert(JSON.stringify(user, null, 2));
}

function contactUser(phone) {
    showNotification(`📞 Calling ${phone}...`, 'info');
}

function trackVehicle(car) {
    // Redirect to map page with car number parameter
    window.location.href = `/map?vehicle=${encodeURIComponent(car)}`;
}

function showNotification(msg, type = 'info') {
    const notif = document.createElement('div');
    notif.className = 'notification';
    notif.style.background = type === 'success' ? 'rgba(0,255,149,0.95)' : 'rgba(13,202,240,0.95)';
    notif.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
    document.body.appendChild(notif);
    setTimeout(() => notif.remove(), 3500);
}

// ========== INITIALIZATION ==========
document.addEventListener('DOMContentLoaded', function() {
    console.log('🚀 SKYWATCH Personnel Command Ready');
    initFirebase();
});
</script>
</body>
</html>
