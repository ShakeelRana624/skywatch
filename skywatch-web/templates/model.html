<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Model - UAV-IOV Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { font-family:'Poppins', sans-serif; margin:0; background:#1a233a; color:white; }
.navbar { background: linear-gradient(90deg, #0dcaf0, #0a58ca); padding:12px 25px; display:flex; justify-content:space-between; align-items:center; }
.nav-buttons button { background:#0dcaf0; color:black; border:none; padding:6px 12px; margin-left:5px; border-radius:20px; cursor:pointer; transition:0.3s; }
.nav-buttons button:hover { background:white; transform: scale(1.05); }

.status-box { background: rgba(26,35,58,0.85); padding:20px; border-radius:12px; margin:15px 0; }
.status { font-weight:600; }
.status.running { color:#00ff95; }
.status.stopped { color:#ff4747; }

.log-container { max-height:50vh; overflow-y:auto; margin-top:10px; background:rgba(0,0,0,0.3); border-radius:8px; padding:10px; font-size:0.9rem; }

.log-entry { opacity:0; transform:translateY(15px); animation: fadeIn 0.5s forwards; margin-bottom:5px; }
@keyframes fadeIn { to {opacity:1; transform:translateY(0);} }

button.control-btn { padding:10px 20px; margin-right:10px; border:none; border-radius:15px; cursor:pointer; font-weight:600; transition:0.3s; }
button.start { background:#00ff95; color:black; }
button.stop { background:#ff4747; color:white; }
button.control-btn:hover { transform: scale(1.05); }

</style>
</head>
<body>
<nav class="navbar">
<h3>AI Model Control</h3>
<div class="nav-buttons">
<button onclick="goHome()">🏠 Home</button>
</div>
</nav>

<div class="container mt-4">
<div class="status-box">
    <h4>AI Model Status: <span id="modelStatus" class="status stopped">Stopped</span></h4>
    <button class="control-btn start" onclick="startModel()">Start</button>
    <button class="control-btn stop" onclick="stopModel()">Stop</button>
</div>

<h4>Inference Logs</h4>
<div class="log-container" id="logContainer"></div>
</div>

<script>
const statusEl = document.getElementById("modelStatus");
const logContainer = document.getElementById("logContainer");

let modelRunning=false;

function startModel(){
    modelRunning=true;
    statusEl.textContent="Running"; statusEl.className="status running";
    addLog("AI Model started...");
}
function stopModel(){
    modelRunning=false;
    statusEl.textContent="Stopped"; statusEl.className="status stopped";
    addLog("AI Model stopped.");
}
function addLog(msg){
    const div = document.createElement("div");
    div.className="log-entry";
    div.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`;
    logContainer.prepend(div);
}
</script>
</body>
</html>
